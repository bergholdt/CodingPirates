<svg xmlns="http://www.w3.org/2000/svg" width="900" height="220" viewBox="0 0 900 220" role="img" aria-labelledby="title desc">
<title id="title">Fra browser til database</title><desc id="desc">Browseren sender en formular til Ruby / Rails i en lokal Dev Container. Alle tre dele kører på elevens egen computer. Ruby / Rails gemmer eller læser databasen og sender en HTML-side tilbage.</desc>
<rect width="900" height="220" fill="white"/>
<g fill="#eef5f5" stroke="#126b70" stroke-width="2"><rect x="20" y="55" width="220" height="110" rx="14"/><rect x="340" y="55" width="220" height="110" rx="14"/><rect x="660" y="55" width="220" height="110" rx="14"/></g>
<g font-family="Arial,sans-serif" fill="#152a3a" text-anchor="middle"><text x="130" y="100" font-size="24">Browser</text><text x="130" y="133" font-size="17">HTML + CSS + JavaScript</text><text x="450" y="100" font-size="24">Lokal server</text><text x="450" y="133" font-size="17">Ruby / Rails</text><text x="770" y="100" font-size="24">Database</text><text x="770" y="133" font-size="17">SQLite</text><text x="290" y="75" font-size="15">POST →</text><text x="290" y="141" font-size="15">← HTML</text><text x="610" y="75" font-size="15">SQL →</text><text x="610" y="141" font-size="15">← data</text><text x="450" y="205" font-size="16">Alt kører på din egen computer · localhost:3000</text></g></svg>
